[package]
name = "codypendent-runtime"
description = "codypendent-runtime: agent runs, tools, approvals bridge, model integration, context, and compaction. The only crate that depends on agent-framework-rs (behind provider features, ADR-009)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codypendent-protocol = { workspace = true }
codypendent-daemon = { workspace = true }
codypendent-integrations = { workspace = true }
# The `codypendent models bench <id>` harness (`src/bench.rs`) measures a local
# model into `codypendent_routing`'s `LocalBench` + `ModelCapabilities` +
# `ModelProfile`. `codypendent-routing` is a leaf crate (protocol-only), so this
# adds no cycle.
codypendent-routing = { workspace = true }
# Generalizes ModelRegistry::client_for to dispatch on Protocol and resolve
# credentials via the async CredentialProvider seam. codypendent-providers is
# a daemon-free, network-free leaf crate (like codypendent-routing), so this
# adds no cycle.
# The model-backed `LlmFactExtractor` (M3b, smarter-memory) implements
# `codypendent_knowledge::FactExtractor` and returns its `CandidateMemory`.
# `codypendent-knowledge` depends on neither the daemon nor this crate, so
# this is a one-way internal edge — no cycle (see its own Cargo.toml comment).
codypendent-knowledge = { workspace = true }
codypendent-providers = { workspace = true }
# MCP tool results are untrusted content: `execute_prepared`'s MCP arm runs
# every result through `codypendent_sandbox::sanitize_untrusted` before it can
# enter the model's observation stream. The sandbox crate is a leaf
# (serde/toml/thiserror/sha2/ed25519 only), so this adds no cycle.
codypendent-sandbox = { workspace = true }
agent-framework-core = { workspace = true }
agent-framework-openai = { workspace = true, optional = true }
agent-framework-anthropic = { workspace = true, optional = true }
# Drives the framework `ChatStream` (`get_streaming_response`) in the live
# `FrameworkModelDriver`; only needed when a streaming provider is compiled in.
futures = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
sqlx = { workspace = true }
# The mock HTTP server for the audio (STT/TTS) clients' tests — this machine has
# no audio hardware and no provider credentials, so `/audio/transcriptions` and
# `/audio/speech` are exercised against wiremock, exactly as the GitHub client is.
wiremock = { workspace = true }

[features]
default = ["provider-openai"]
provider-openai = ["dep:agent-framework-openai", "dep:futures"]
provider-anthropic = ["dep:agent-framework-anthropic"]

[lints]
workspace = true
