[package]
name = "codypendent-tui"
description = "codypendent-tui: Ratatui rendering, input, layout, components, and themes. Speaks only protocol types — no database or network code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Bench targets are listed explicitly below; autodiscovery is off so a stray
# file under `benches/` cannot silently become a build target.
autobenches = false

[features]
default = []
vt100-tests = ["dep:vt100"]

[dependencies]
codypendent-protocol = { workspace = true }
codypendent-ui-host = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Theme packs (Phase 6, STEP 6.6) are data-only TOML manifests. Parsing them
# here keeps themes in one crate; the loader rejects any manifest that declares
# an execution capability (README: theme plugins get no execution permissions).
toml = { workspace = true }
thiserror = { workspace = true }
# Rich TUI output formatting (Phase 6): the markdown parser behind the
# finalize-time `markdown::parse` cache (client-only; see markdown.rs).
pulldown-cmark = { workspace = true }
# Per-language fenced-code syntax highlighting (client-only; see markdown.rs).
synoptic = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
# Stable ids for blocks the Docs Studio inserts. The `Insert` mutation carries
# the block's id from the client (the CRDT anchors links/citations to it), so
# the reducer must mint one — the same time-ordered v7 form the fabric uses.
uuid = { workspace = true }
vt100 = { workspace = true, optional = true }

[dev-dependencies]
codypendent-tui = { path = ".", features = ["vt100-tests"] }
insta = { workspace = true }
criterion = { workspace = true }

# The per-frame (`render`) and per-keystroke (`reduce`) paths.
# `harness = false` gives criterion `main` and is what keeps the target out of
# `cargo test` (verified with `cargo test -p codypendent-tui --no-run`);
# `test = false` restates that intent explicitly. See crates/protocol/Cargo.toml.
[[bench]]
name = "frame"
harness = false
test = false

# A fixed-iteration CPU-time harness for the same render paths. `frame` measures
# wall time, which is only believable on a quiet machine; this one runs an exact
# number of draws so the caller can read USER CPU off `/usr/bin/time`, which an
# oversubscribed scheduler does not distort. See the module docs.
[[bench]]
name = "overlay_cpu"
harness = false
test = false

[lints]
workspace = true
