[package]
name = "codypendent-secrets"
description = "codypendent-secrets: the secret broker and credential reference domain (Milestone 5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
# Authenticated encryption for the managed backend's envelope store. RustCrypto's
# ChaCha20-Poly1305 (RFC 8439): pure Rust, no C toolchain, no system OpenSSL.
# Chosen over AES-GCM because it needs no AES-NI to be constant-time, and the
# daemon runs on whatever the user has.
chacha20poly1305 = "0.11"
chrono = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
# NOTE: `tracing` is deliberately NOT a dependency of this crate. A secret
# broker with a logging facade in scope is one careless `tracing::debug!` away
# from a credential in a log file. Leaving it out makes "this crate never logs"
# a compile error rather than a review convention. If diagnostics are ever
# needed, return a typed error and let the caller log the code — never the value.
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
