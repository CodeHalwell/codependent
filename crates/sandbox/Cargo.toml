[package]
name = "codypendent-sandbox"
description = "codypendent-sandbox: the plugin security boundary (Phase 6). Parses plugin.toml, verifies checksum/signature, evaluates capability permissions, computes permission diffs for updates, drives the install→verify→enable lifecycle, and derives a sandbox profile from the granted capabilities. Pure decision logic — OS-level process/WASM isolation wires onto these grants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Plugin manifests are TOML — the exact shape of `docs/specs/plugin.toml`.
toml = { workspace = true }
thiserror = { workspace = true }
# UI protocol/SDK declarations use semver ranges so compatible additive host
# minors do not force every plugin manifest to be republished.
semver = "1"
# Artifact checksum (sha256) + hex encoding of digests.
sha2 = { workspace = true }
hex = { workspace = true }
# Publisher signature over the checksum (ed25519), key + signature carried as
# base64 text in the manifest's `[security]` table.
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# One-shot approval receipts bind a human decision to one pending update.
uuid = { workspace = true }
# The WASM guest runtime (STEP 6.3). `wasmi` rather than `wasmtime`: a skill
# module runs for milliseconds, so an interpreter is fast enough, and it avoids
# putting a JIT — which compiles attacker-supplied bytecode to native code, with
# W^X pages, signal-based traps and an unwinder — inside the trust boundary.
# `default-features = false` drops the `wat` text parser AND the SIMD proposal
# from the build entirely, so neither is reachable from guest bytes at all.
# Fuel metering and the resource limiter are core, not features.
# See `.impl/threat-models/12-executable-skills.md` §4 for the full rationale,
# including the measured dependency-count comparison against wasmtime.
wasmi = { version = "1.1", default-features = false, features = ["std"] }

[dev-dependencies]
# Assembles the WebAssembly *text* fixtures the WASM host tests are written in.
# Deliberately a separate dev-dependency rather than wasmi's own `wat` feature:
# that feature makes `Module::new` accept text, so enabling it would leave the
# tests exercising a parser the shipped binary does not have. Assembling to
# binary here keeps the test and production paths identical.
wat = "1"
# Temp dirs for the trusted-publisher store and enforcement integration tests.
tempfile = { workspace = true }

[lints]
workspace = true
