[package]
name = "codypendent-control-plane-protocol"
description = "Codypendent Control Plane Protocol: wire types, identifiers, sync envelopes, audit events, and schemas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
schema-export = ["dep:schemars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "export_control_plane_schema"
path = "src/bin/export_schema.rs"
required-features = ["schema-export"]

[lints]
workspace = true
