# --- (unsloth GGUF - ollama pull first) ---
# NOT live catalog data: every row below is commented out, so
# `Catalog::models()` never sees it -- the referenced weights don't exist
# locally until you pull them. Run `codypendent models pull
# unsloth/<repo>[:<quant>]` (or `ollama pull hf.co/unsloth/<repo>:<quant>`
# directly); either path registers a REAL [[model]] row in
# <data_dir>/models.toml for you, using the exact id shown below. These six
# are a currently-popular cross-section (coding / small / general / large
# MoE / long-context), verified against the live Hugging Face Hub API
# (https://huggingface.co/api/models?author=unsloth&filter=gguf&sort=downloads)
# while curating this list -- downloads, sizes, and what's "popular" drift,
# so re-check before relying on the exact figures. No cost fields: local
