# --- ACP agents (delegate a turn; the agent owns its model) ---
[[provider]]
id = "gemini-cli"
name = "Gemini CLI (ACP)"
protocol = "acp"
[[provider.auth]]
kind = "acp"
command = "gemini"
args = ["--acp"]

[[provider]]
id = "claude-code"
name = "Claude Code (ACP)"
protocol = "acp"
[[provider.auth]]
kind = "acp"
command = "npx"
args = ["-y", "@agentclientprotocol/claude-agent-acp"]

[[provider]]
id = "codex"
name = "OpenAI Codex (ACP)"
protocol = "acp"
[[provider.auth]]
kind = "acp"
command = "npx"
args = ["-y", "@agentclientprotocol/codex-acp"]

[[provider]]
id = "opencode"
name = "OpenCode (ACP)"
protocol = "acp"
[[provider.auth]]
kind = "acp"
command = "opencode"
args = ["acp"]

[[provider]]
id = "cursor"
name = "Cursor CLI (ACP)"
protocol = "acp"
[[provider.auth]]
kind = "acp"
command = "agent"
args = ["acp"]

# =============================================================================
# Curated model prefill — added by the 2026-08-11 product review.
#
# Display-only metadata (`providers/src/model.rs::Model`), addressed by
# (provider_id, id) and served via `Catalog::models()` / `Catalog::model()`.
# Sources: live `/models` dumps (Nebius models_info, OpenRouter, DeepInfra,
# SambaNova, Novita, Venice, Chutes, Inference.net, OpenCode Zen) and official
# provider docs, all captured 2026-08-11 — see
# docs/reviews/2026-08-11-verticals/11-model-catalog-research.md for the
# discovery-endpoint matrix, per-model capability flags, and confidence notes.
# Prices are USD per 1M tokens and are omitted where unverified. Ids are the
# exact strings each API expects. Providers whose catalogs are huge or
# key-gated (OpenRouter beyond flagships, Featherless, Fireworks, Hyperbolic,
# Parasail) are left to live `GET {base}/models` discovery.
# =============================================================================

