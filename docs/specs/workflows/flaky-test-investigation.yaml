schema_version: 1
id: flaky-test-investigation
version: 1
description: >-
  Investigate and isolate flaky tests through repeated verification runs,
  diagnostics analysis, and root cause hypothesis generation.
orchestration_reason: specialist

inputs:
  test_filter:
    type: string
    required: false

budget:
  maximum_cost_usd: 4.00
  maximum_duration_seconds: 2400
  maximum_agents: 2

steps:
  - id: verify
    tool: repository.test
    retry:
      attempts: 3
      backoff_seconds: 2
    outputs: [test_result]

  - id: diagnose
    depends_on: [verify]
    agent:
      role: investigator
      model_policy: coding
    outputs: [finding, hypothesis]

  - id: review
    depends_on: [diagnose]
    agent:
      role: reviewer
      model_policy: review
    outputs: [decision]
